<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle">VOD Blur</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0e0e10; color: #efeff1;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 40px 16px; }
    header { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    header > div:first-child { flex: 1; min-width: 260px; }
    .tools { display: flex; gap: 8px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { margin: 0 0 28px; color: #adadb8; }
    .site { margin-bottom: 20px; background: #18181b; border: 1px solid #2a2a30; border-radius: 12px; overflow: hidden; }
    .site h2 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid #2a2a30; }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
    .item + .item { border-top: 1px solid #222228; }
    .type {
      flex: none; padding: 2px 8px; border-radius: 6px; background: #26262c; color: #bf94ff;
      font-size: 12px; font-weight: 600;
    }
    .where { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .where input {
      width: 100%; max-width: 320px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid #3a3a42;
      background: #26262c; color: #efeff1; font: inherit;
    }
    .where a { color: #efeff1; }
    .count { color: #adadb8; font-size: 13px; }
    button {
      height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid #3a3a42; background: #26262c;
      color: #efeff1; font: inherit; cursor: pointer;
    }
    button:hover { background: #34343b; }
    button:disabled { opacity: .4; cursor: default; background: #26262c; }
    button.armed { background: #e5484d; border-color: #e5484d; color: #fff; }
    #empty { color: #adadb8; }
    #status { margin: -12px 0 24px; color: #adadb8; }
    #status.error { color: #f5b14c; }
    footer { margin-top: 28px; }
    #presets { margin-top: 36px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>VOD Blur</h1>
        <p class="sub" data-i18n-html="optionsSub"></p>
      </div>
      <div class="tools">
        <button id="export" data-i18n="exportBtn" data-i18n-title="exportTitle"></button>
        <button id="import" data-i18n="importBtn" data-i18n-title="importTitle"></button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
    </header>
    <p id="status" role="status" hidden></p>
    <div id="list"></div>
    <p id="empty" data-i18n="optionsEmpty" hidden></p>
    <footer id="footer" hidden></footer>
    <section class="site" id="presets" hidden>
      <h2 data-i18n="presetsTitle"></h2>
      <div id="presetList"></div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
